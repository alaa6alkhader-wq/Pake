name: Build App With Pake CLI

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "windows-latest"
        type: choice
        options:
          - windows-latest
          - macos-latest
          - ubuntu-latest
      name:
        description: "App name"
        required: true
        default: "MyApp"

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and Build Project to dist
        run: |
          npm install
          npm run build

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build Windows App Offline with Pake
        run: |
          pake dist --name "${{ inputs.name }}"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ inputs.platform }}
          path: |
            *.msi
            *.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
